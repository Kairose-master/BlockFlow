name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  node:
    name: typecheck + vitest (solc-js, JS EVM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm bench
      - name: 생성 컨트랙트·테스트가 커밋본과 같은지 (diff 0)
        run: |
          pnpm gen:examples
          git diff --exit-code -- contracts/src contracts/test/generated

  foundry:
    name: forge test (invariant + scenarios)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
      - run: forge install foundry-rs/forge-std
      - run: forge build --sizes
      - run: forge test -vv

  slither:
    name: slither (V3 정적 분석)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
      - run: cd contracts && forge install foundry-rs/forge-std
      - uses: crytic/slither-action@v0.4.1
        with:
          target: contracts/
          slither-config: contracts/slither.config.json
          fail-on: medium

  modeler:
    name: modeler (next build + playwright e2e)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @blockflow/modeler typecheck
      - run: pnpm --filter @blockflow/modeler build
      - run: pnpm --filter @blockflow/modeler exec playwright install --with-deps chromium
      - run: pnpm --filter @blockflow/modeler e2e
        env:
          CI: "1"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/modeler/test-results
